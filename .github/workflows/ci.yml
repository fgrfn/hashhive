name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  check:
    name: Lint & syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip ruff pytest==9.1.1
          pip install -r backend/requirements.lock

      - name: Lint (ruff)
        run: ruff check backend/

      - name: Compile check
        run: python -m py_compile backend/main.py backend/alerts.py backend/gen_cert.py

      - name: Import check
        run: python -c "import sys; sys.path.insert(0, 'backend'); import main; print('OK')"
        env:
          HASHHIVE_DATA_DIR: /tmp/hashhive-ci

      - name: Unit tests
        run: pytest backend/tests

  frontend:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Lint (eslint)
        run: npm run lint
        working-directory: app

      - name: Unit tests
        run: npm test
        working-directory: app

      - name: Type-check & build
        run: npm run build
        working-directory: app

  secret-scan:
    name: Detect secrets & API key leaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build & push Docker image
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/dev' ||
       startsWith(github.ref, 'refs/tags/v'))
    needs: [check, frontend, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "${VERSION}" > version.txt
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            echo "version=latest" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "latest" > version.txt
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
            echo "dev" > version.txt
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.docker.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Docker

            **Quick start:**
            ```bash
            docker run -d -p 8000:8000 \
              -v hashhive-data:/app/backend/data \
              ghcr.io/${{ github.repository }}:${{ needs.docker.outputs.version }}
            ```

            **Docker Compose:**
            ```yaml
            services:
              hashhive:
                image: ghcr.io/${{ github.repository }}:${{ needs.docker.outputs.version }}
                ports: ["8000:8000"]
                volumes: [hashhive-data:/app/backend/data]
                restart: unless-stopped
            volumes:
              hashhive-data:
            ```

            **Update:**
            ```bash
            docker compose pull && docker compose up -d
            ```

            Dashboard: **http://localhost:8000**
